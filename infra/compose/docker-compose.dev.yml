# dev: образы из реестра (тег — IMAGE_TAG), перезапуск unless-stopped, мягкие лимиты памяти.
services:
  gateway:
    image: ${REGISTRY:?}/gateway:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 1024m
    ports:
      - "3000:3000"
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"

  identity:
    image: ${REGISTRY:?}/identity:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 1024m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"
      SEED_AUTH_PASSWORD: "${SEED_AUTH_PASSWORD:?}"
    depends_on:
      firebase-auth:
        condition: service_healthy

  content:
    image: ${REGISTRY:?}/content:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 1024m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"

  discussion:
    image: ${REGISTRY:?}/discussion:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 1024m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"

  messaging:
    image: ${REGISTRY:?}/messaging:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 1024m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"

  notification:
    image: ${REGISTRY:?}/notification:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 1024m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"

  media:
    image: ${REGISTRY:?}/media:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_reservation: 256m
    mem_limit: 1024m
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"

  identity-migrate:
    image: ${REGISTRY:?}/identity:${IMAGE_TAG:?}

  content-migrate:
    image: ${REGISTRY:?}/content:${IMAGE_TAG:?}

  discussion-migrate:
    image: ${REGISTRY:?}/discussion:${IMAGE_TAG:?}

  messaging-migrate:
    image: ${REGISTRY:?}/messaging:${IMAGE_TAG:?}

  notification-migrate:
    image: ${REGISTRY:?}/notification:${IMAGE_TAG:?}

  media-migrate:
    image: ${REGISTRY:?}/media:${IMAGE_TAG:?}

  identity-db:
    restart: unless-stopped
    mem_limit: 1024m

  content-db:
    restart: unless-stopped
    mem_limit: 1024m

  discussion-db:
    restart: unless-stopped
    mem_limit: 1024m

  messaging-db:
    restart: unless-stopped
    mem_limit: 1024m

  notification-db:
    restart: unless-stopped
    mem_limit: 1024m

  media-db:
    restart: unless-stopped
    mem_limit: 1024m

  nats:
    restart: unless-stopped
    mem_limit: 512m

  minio:
    restart: unless-stopped
    mem_limit: 1024m

  web:
    image: ${REGISTRY:?}/web:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8080:8080"
    environment:
      CSP_EMULATOR_ORIGIN: "http://${FIREBASE_AUTH_EMULATOR_HOST:?}"
      CSP_API_ORIGIN: "${VITE_API_BASE_URL:-}"

  firebase-auth:
    image: ${REGISTRY:?}/firebase-auth:${IMAGE_TAG:?}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?}"
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"
    ports:
      - "9099:9099"
    networks:
      default:
        aliases:
          - firebase-auth.localhost
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

