# local: запуск из исходников с горячей перезагрузкой, открытые порты, эмулятор firebase-auth, без перезапуска.
# Сервисы — `tsx watch` (перезапуск процесса при правке `src` сервиса или `packages/*/src`),
# клиент — dev-сервер Vite с HMR. Образ общий — blog/dev:local (infra/docker/dev.Dockerfile).
# Пересборка образа нужна только после изменения зависимостей: `pnpm infra:up local` делает её сам.
services:
  gateway:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/gateway-service
    command: ["tsx", "watch", "--clear-screen=false", "src/main.ts"]
    volumes:
      - ../../services/gateway-service/src:/repo/services/gateway-service/src:ro
    ports:
      - "3000:3000"
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"

  identity:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/identity-service
    command: ["tsx", "watch", "--clear-screen=false", "src/main.ts"]
    volumes:
      - ../../services/identity-service/src:/repo/services/identity-service/src:ro
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"
      SEED_AUTH_PASSWORD: "${SEED_AUTH_PASSWORD:?}"
    depends_on:
      firebase-auth:
        condition: service_healthy

  content:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/content-service
    command: ["tsx", "watch", "--clear-screen=false", "src/main.ts"]
    volumes:
      - ../../services/content-service/src:/repo/services/content-service/src:ro

  discussion:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/discussion-service
    command: ["tsx", "watch", "--clear-screen=false", "src/main.ts"]
    volumes:
      - ../../services/discussion-service/src:/repo/services/discussion-service/src:ro

  messaging:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/messaging-service
    command: ["tsx", "watch", "--clear-screen=false", "src/main.ts"]
    volumes:
      - ../../services/messaging-service/src:/repo/services/messaging-service/src:ro

  notification:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/notification-service
    command: ["tsx", "watch", "--clear-screen=false", "src/main.ts"]
    volumes:
      - ../../services/notification-service/src:/repo/services/notification-service/src:ro

  media:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/media-service
    command: ["tsx", "watch", "--clear-screen=false", "src/main.ts"]
    volumes:
      - ../../services/media-service/src:/repo/services/media-service/src:ro

  identity-migrate:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/identity-service
    command: ["tsx", "src/migrate.ts"]
    volumes:
      - ../../services/identity-service/src:/repo/services/identity-service/src:ro

  content-migrate:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/content-service
    command: ["tsx", "src/migrate.ts"]
    volumes:
      - ../../services/content-service/src:/repo/services/content-service/src:ro

  discussion-migrate:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/discussion-service
    command: ["tsx", "src/migrate.ts"]
    volumes:
      - ../../services/discussion-service/src:/repo/services/discussion-service/src:ro

  messaging-migrate:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/messaging-service
    command: ["tsx", "src/migrate.ts"]
    volumes:
      - ../../services/messaging-service/src:/repo/services/messaging-service/src:ro

  notification-migrate:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/notification-service
    command: ["tsx", "src/migrate.ts"]
    volumes:
      - ../../services/notification-service/src:/repo/services/notification-service/src:ro

  media-migrate:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/services/media-service
    command: ["tsx", "src/migrate.ts"]
    volumes:
      - ../../services/media-service/src:/repo/services/media-service/src:ro

  identity-db:
    restart: "no"
    ports:
      - "5433:5432"

  content-db:
    restart: "no"
    ports:
      - "5434:5432"

  discussion-db:
    restart: "no"
    ports:
      - "5435:5432"

  messaging-db:
    restart: "no"
    ports:
      - "5436:5432"

  notification-db:
    restart: "no"
    ports:
      - "5437:5432"

  media-db:
    restart: "no"
    ports:
      - "5438:5432"

  nats:
    restart: "no"
    ports:
      - "4222:4222"

  minio:
    restart: "no"
    ports:
      - "9000:9000"
      - "9001:9001"

  # Dev-сервер Vite вместо nginx со сборкой: CSP из web.nginx.conf здесь не действует, её проверяют dev и prod.
  web:
    extends: { file: dev-source.yml, service: source }
    working_dir: /repo/apps/web
    command: ["node_modules/.bin/vite", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    volumes:
      - ../../apps/web/src:/repo/apps/web/src:ro
      - ../../apps/web/public:/repo/apps/web/public:ro
    ports:
      - "8080:8080"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  firebase-auth:
    build:
      context: ../..
      dockerfile: infra/docker/firebase-auth.Dockerfile
    image: blog/firebase-auth:local
    restart: "no"
    environment:
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?}"
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"
    ports:
      - "9099:9099"
    networks:
      default:
        aliases:
          - firebase-auth.localhost
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
