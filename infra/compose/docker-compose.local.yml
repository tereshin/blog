# local: сборка из исходников, открытые порты, эмулятор firebase-auth, без перезапуска.
services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: gateway-service
    image: blog/gateway:local
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"

  identity:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: identity-service
    image: blog/identity:local
    restart: "no"
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"
      SEED_AUTH_PASSWORD: "${SEED_AUTH_PASSWORD:?}"
    depends_on:
      firebase-auth:
        condition: service_healthy

  content:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: content-service
    image: blog/content:local
    restart: "no"

  discussion:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: discussion-service
    image: blog/discussion:local
    restart: "no"

  messaging:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: messaging-service
    image: blog/messaging:local
    restart: "no"

  notification:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: notification-service
    image: blog/notification:local
    restart: "no"

  media:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: media-service
    image: blog/media:local
    restart: "no"

  identity-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: identity-service
    image: blog/identity:local

  content-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: content-service
    image: blog/content:local

  discussion-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: discussion-service
    image: blog/discussion:local

  messaging-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: messaging-service
    image: blog/messaging:local

  notification-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: notification-service
    image: blog/notification:local

  media-migrate:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: media-service
    image: blog/media:local

  identity-db:
    restart: "no"
    ports:
      - "5433:5432"

  content-db:
    restart: "no"
    ports:
      - "5434:5432"

  discussion-db:
    restart: "no"
    ports:
      - "5435:5432"

  messaging-db:
    restart: "no"
    ports:
      - "5436:5432"

  notification-db:
    restart: "no"
    ports:
      - "5437:5432"

  media-db:
    restart: "no"
    ports:
      - "5438:5432"

  nats:
    restart: "no"
    ports:
      - "4222:4222"

  minio:
    restart: "no"
    ports:
      - "9000:9000"
      - "9001:9001"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    image: blog/web:local
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      CSP_EMULATOR_ORIGIN: "http://${FIREBASE_AUTH_EMULATOR_HOST:?}"
      CSP_API_ORIGIN: "http://localhost:3000"

  firebase-auth:
    build:
      context: ../..
      dockerfile: infra/docker/firebase-auth.Dockerfile
    image: blog/firebase-auth:local
    restart: "no"
    environment:
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?}"
      FIREBASE_AUTH_EMULATOR_HOST: "${FIREBASE_AUTH_EMULATOR_HOST:?}"
    ports:
      - "9099:9099"
    networks:
      default:
        aliases:
          - firebase-auth.localhost
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

