# Только статика клиента. Проксирования /v1 здесь нет: это был бы обратный прокси (FR-126).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: ${S3_PUBLIC_URL}; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://platform.twitter.com https://github.com https://codepen.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Хэшированные файлы сборки не меняются: кэшируем надолго.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # SPA-fallback: любой адрес раздела отдаёт index.html, маршрутизатор клиента решает остальное.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: ${S3_PUBLIC_URL}; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://platform.twitter.com https://github.com https://codepen.io; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /index.html;
  }
}
