# Static assets stay in nginx; gateway composes public page HTML with SEO data.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # CSP_API_ORIGIN — origin gateway, когда клиент на другом origin (local/dev). В prod пустой: один origin с 'self'.
  # `${S3_PUBLIC_URL}/`: источник с путём без завершающего `/` в CSP совпадает только с этим путём, а не с файлами внутри.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://connect.facebook.net; style-src 'self'; img-src 'self' data: https://www.facebook.com https://img.heroui.chat ${S3_PUBLIC_URL}/; connect-src 'self' https://www.facebook.com https://connect.facebook.net ${CSP_API_ORIGIN} https://identitytoolkit.googleapis.com https://securetoken.googleapis.com ${CSP_EMULATOR_ORIGIN}; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://platform.twitter.com https://github.com https://codepen.io https://accounts.google.com ${CSP_AUTH_ORIGIN} ${CSP_EMULATOR_ORIGIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Хэшированные файлы сборки не меняются: кэшируем надолго.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Gateway reads this template directly; this exact location prevents a proxy loop.
  location = /index.html { try_files /index.html =404; }

  location ~ ^/(robots\.txt|sitemap\.xml|sitemaps/[^/]+\.xml)$ {
    proxy_pass http://gateway:3000;
    add_header Cache-Control "no-cache";
  }

  # Existing static files are served directly; application paths get server HTML.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com https://connect.facebook.net; style-src 'self'; img-src 'self' data: https://www.facebook.com https://img.heroui.chat ${S3_PUBLIC_URL}/; connect-src 'self' https://www.facebook.com https://connect.facebook.net ${CSP_API_ORIGIN} https://identitytoolkit.googleapis.com https://securetoken.googleapis.com ${CSP_EMULATOR_ORIGIN}; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com https://platform.twitter.com https://github.com https://codepen.io https://accounts.google.com ${CSP_AUTH_ORIGIN} ${CSP_EMULATOR_ORIGIN}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    try_files $uri @application;
  }
  location @application {
    proxy_pass http://gateway:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Use the gateway CSP (including the JSON-LD nonce), not two intersecting policies.
    add_header Cache-Control "no-store";
  }
}
