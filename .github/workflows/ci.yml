name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      # Update this image tag and the Playwright version in pnpm-lock.yaml together.
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      # The database tests use the runner's Docker socket and published ports.
      options: --user 0 --init --ipc=host --add-host=host.docker.internal:host-gateway
    env:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:contract
      - run: pnpm audit --audit-level=high
      - run: pnpm --filter web build
      - run: pnpm --filter web size
      - run: pnpm --filter web build-storybook
      - run: pnpm --filter web test:e2e

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each worker starts real containers; bound both service and test-file concurrency.
      - run: pnpm -r --workspace-concurrency=1 --if-present test:integration --maxWorkers=2

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:infra
